name: CI

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SubsRetimer/SubsRetimer.csproj -c Release
      - run: dotnet test SubsRetimer.Tests/SubsRetimer.Tests.csproj -c Release
